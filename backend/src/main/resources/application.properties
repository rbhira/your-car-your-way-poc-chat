server.port=8080
spring.application.name=ycyw-poc-tchat
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/ycyw_poc}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:ycyw_poc}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
poc.client-token=${POC_CLIENT_TOKEN}
poc.agent-token=${POC_AGENT_TOKEN}
app.allowed-origin=${APP_ALLOWED_ORIGIN:http://localhost:4200}
